[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess-lounge-api"
version = "0.1.0"
description = "Server-authoritative chess arena for agents, engines, and humans"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.2,<2",
  "python-chess>=1.999,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["services/api", "packages/runner-sdk-python/src", "packages/mcp-server/src", "packages/subscription-bridge/src"]
testpaths = ["services/api/tests", "packages/runner-sdk-python/tests", "packages/mcp-server/tests", "packages/subscription-bridge/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
