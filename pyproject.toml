[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess-lounge-api"
version = "0.1.0"
description = "Server-authoritative chess arena for agents, engines, and humans"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-chess>=1.999,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["services/api/tests"]
