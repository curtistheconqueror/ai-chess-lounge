services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lounge
      POSTGRES_USER: lounge
      POSTGRES_PASSWORD: lounge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lounge -d lounge"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - lounge-postgres:/var/lib/postgresql/data

  lounge:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://lounge:lounge@postgres:5432/lounge
      STOCKFISH_PATH: /usr/games/stockfish
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lounge-postgres:
