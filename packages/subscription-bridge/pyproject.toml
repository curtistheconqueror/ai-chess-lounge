[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess-lounge-subscription"
version = "0.1.0"
description = "Local authorized CLI subscription bridge for AI Chess Lounge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ai-chess-lounge-runner>=0.1,<0.2", "httpx>=0.28,<1"]

[project.scripts]
lounge-subscription-bridge = "lounge_subscription.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
