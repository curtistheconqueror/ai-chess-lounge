[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess-lounge-runner"
version = "0.1.0"
description = "Python runner SDK for AI Chess Lounge remote agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "truststore>=0.10,<1"]

[project.scripts]
lounge-sample-bot = "ai_chess_lounge_runner.sample:main"

[tool.setuptools.packages.find]
where = ["src"]
