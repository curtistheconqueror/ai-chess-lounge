[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chess-lounge-mcp"
version = "0.1.0"
description = "Provider-neutral local MCP bridge for AI Chess Lounge"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "ai-chess-lounge-runner>=0.1,<0.2", "httpx>=0.28,<1"]

[project.scripts]
lounge-mcp = "lounge_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
