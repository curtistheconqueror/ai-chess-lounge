name: Publish Stage 3F contributor branch

on:
  push:
    branches:
      - feat/stage-3f-provider-recovery
    paths:
      - .github/workflows/stage3f-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-3f-provider-recovery
          fetch-depth: 0
      - name: Apply verified Stage 3F patch
        env:
          PATCH_GZIP_BASE64: 
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode > /tmp/stage3f.patch.gz
          echo 'e0eaa58269c361979d4852636c823cf2d30dfcf4dc8679e382b75a3102f2bfbd  /tmp/stage3f.patch.gz' | sha256sum --check -
          gzip -dc /tmp/stage3f.patch.gz > /tmp/stage3f.patch
          echo '81828c47bcb96850c50d83b8d0489c1569feb3b294d4fae87801553c0c38fb50  /tmp/stage3f.patch' | sha256sum --check -
          git apply --check /tmp/stage3f.patch
          git apply /tmp/stage3f.patch
          rm .github/workflows/stage3f-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add bounded provider recovery'
          git push origin HEAD:feat/stage-3f-provider-recovery
