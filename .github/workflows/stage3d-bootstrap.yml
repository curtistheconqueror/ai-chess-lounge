name: Stage 3D bootstrap

on:
  push:
    branches: [feat/stage-3d-gemini-adapter]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Apply verified Stage 3D patch
        run: |
          git apply .github/workflows/stage3d.patch
          rm .github/workflows/stage3d.patch
          rm .github/workflows/stage3d-bootstrap.yml

      - name: Commit Stage 3D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add Google Gemini chess adapter"
          git push
