name: Publish Stage 5B branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage5b-publish.yml
      - .github/workflows/stage5b.patch.gz

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, clean up, and publish exact Stage 5B patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/workflows/stage5b.patch.gz | cut -d' ' -f1)" = "25ae3d64c7d1680c4f5f8718807cd22cc19bda8c608d4f15819a360ff6463ee7"
          cp .github/workflows/stage5b.patch.gz /tmp/stage5b.patch.gz
          gzip -dc /tmp/stage5b.patch.gz > /tmp/stage5b.patch
          test "$(sha256sum /tmp/stage5b.patch | cut -d' ' -f1)" = "8c6c4157a30a5821f6bdd094dc43ec00e08ee0cdf4b262c948c3018801ecb3dc"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage5b-publish.yml .github/workflows/stage5b.patch.gz
          git commit -m "chore: remove Stage 5B publisher"
          git push origin HEAD:main

          git switch -c feat/stage-5b-runner-sdk
          git apply --check /tmp/stage5b.patch
          git apply /tmp/stage5b.patch
          git add -A
          git diff --cached --binary > /tmp/stage5b-applied.patch
          test "$(sha256sum /tmp/stage5b-applied.patch | cut -d' ' -f1)" = "8c6c4157a30a5821f6bdd094dc43ec00e08ee0cdf4b262c948c3018801ecb3dc"
          git add -A
          git commit -m "feat: add remote runner SDKs"
          git push origin feat/stage-5b-runner-sdk
          git rev-parse HEAD
