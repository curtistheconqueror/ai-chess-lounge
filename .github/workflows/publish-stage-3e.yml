name: Publish Stage 3E

on:
  push:
    branches:
      - feat/stage-3e-open-ecosystem-adapters

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/stage-3e-open-ecosystem-adapters
      - name: Apply locally verified Stage 3E patch
        env:
          PATCH_B64: >-
            
          PATCH_SHA256: 829b563721c6b1df8bd7074bec7684d90a84d549a9048402532bb17a9255b6f6
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/stage-3e.patch
          echo "$PATCH_SHA256  /tmp/stage-3e.patch" | sha256sum --check --strict
          git apply --index /tmp/stage-3e.patch
          git rm .github/workflows/publish-stage-3e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add open ecosystem chess adapters"
          git push

