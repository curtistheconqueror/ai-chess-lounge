name: Publish Stage 5D contributor checkpoint
on:
  push:
    branches: [feat/stage-5d-subscription-bridge]
    paths: [.github/workflows/publish-stage5d.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply verified contributor patch and remove bootstrap files
        shell: bash
        run: |
          gzip -dc .github/workflows/stage5d.patch.gz > /tmp/stage5d.patch
          echo "701a36a842c2f04559662801ea11c5972b13256f27dc4d9652882eeb9cc78ce0  /tmp/stage5d.patch" | sha256sum --check
          git apply --check /tmp/stage5d.patch
          git apply /tmp/stage5d.patch
          git rm .github/workflows/publish-stage5d.yml .github/workflows/stage5d.patch.gz
          git add README.md apps/web/src/App.tsx docs/MASTER_PLAN.md docs/adr/0018-local-subscription-bridge.md docs/verification packages/subscription-bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve safe proxy routing and verify live subscription game"
          git push origin HEAD:feat/stage-5d-subscription-bridge
