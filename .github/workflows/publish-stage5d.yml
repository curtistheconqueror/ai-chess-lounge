name: Publish Stage 5D contributor checkpoint
on:
  push:
    branches: [feat/stage-5d-subscription-bridge]
    paths: [.github/workflows/publish-stage5d.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply verified contributor patch and remove bootstrap files
        shell: bash
        run: |
          gzip -dc .github/workflows/stage5d.patch.gz > /tmp/stage5d.patch
          echo "b99ff82e286419801b288443a71845a38cadeb3a628c7e17264629989d97cd5c  /tmp/stage5d.patch" | sha256sum --check
          git apply --check /tmp/stage5d.patch
          git apply /tmp/stage5d.patch
          git rm .github/workflows/publish-stage5d.yml .github/workflows/stage5d.patch.gz
          git add Makefile README.md apps/web/e2e/lounge.spec.ts apps/web/src/App.tsx apps/web/src/api.ts apps/web/src/types.ts docs/MASTER_PLAN.md docs/PICKUP.md docs/adr/0018-local-subscription-bridge.md pyproject.toml services/api/lounge_api/models.py services/api/lounge_api/player_protocol.py services/api/lounge_api/remote_runner.py services/api/tests/test_remote_runner.py packages/subscription-bridge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add experimental one-match subscription CLI bridge"
          git push origin HEAD:feat/stage-5d-subscription-bridge
