name: Stage 3C bootstrap

on:
  push:
    branches: [feat/stage-3c-anthropic-adapter]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Apply verified Stage 3C patch
        env:
          PATCH_GZ_B64: >-
            
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/stage3c.patch
          git apply /tmp/stage3c.patch
          rm .github/workflows/stage3c-bootstrap.yml

      - name: Commit Stage 3C
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add Anthropic Messages chess adapter"
          git push
