name: Stage 3C PR

on:
  push:
    branches: [feat/stage-3c-anthropic-adapter]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove one-shot publisher
        run: |
          rm .github/workflows/stage3c-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: remove Stage 3C publisher"
          git push

      - name: Open Stage 3C pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body_file="$(mktemp)"
          printf '%s\n' \
            '## Summary' \
            '' \
            '- add a direct server-side Anthropic Messages adapter with adaptive effort mapping' \
            '- share normalized move validation while honoring Anthropic structured-output schema limits' \
            '- add Claude/OpenAI cross-provider seat selection with secret-free player settings' \
            '- add contract, failure, manager, protocol, catalog, and browser coverage' \
            '- document the Stage 3C credential boundary and provider behavior' \
            '' \
            '## Verification' \
            '' \
            '- [x] Ruff formatting and lint' \
            '- [x] Backend test suite passed locally (one environment-specific skip)' \
            '- [x] SQLite migration upgrade/current/downgrade' \
            '- [x] Web typecheck and production build' \
            '- [x] 25 Playwright scenarios configured; GitHub CI executes Chromium' \
            '- [x] No credential committed' > "$body_file"
          pr_url="$(gh pr create \
            --base main \
            --head feat/stage-3c-anthropic-adapter \
            --title 'feat: add Anthropic Messages chess adapter' \
            --body-file "$body_file")"
          printf 'url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
          printf 'number=%s\n' "${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          for attempt in $(seq 1 90); do
            checks="$(gh pr checks "$PR_NUMBER" --json bucket --jq '.[].bucket' 2>/dev/null || true)"
            if [ -z "$checks" ] || printf '%s\n' "$checks" | grep -Eq 'pending|skipping'; then
              sleep 10
              continue
            fi
            if printf '%s\n' "$checks" | grep -Eq 'fail|cancel'; then
              gh pr checks "$PR_NUMBER"
              exit 1
            fi
            head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
            gh api \
              --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
              -f merge_method=squash \
              -f sha="$head_sha"
            exit 0
          done
          echo "Timed out waiting for CI" >&2
          exit 1
