name: Stage 3B bootstrap

on:
  push:
    branches:
      - feat/stage-3b-openai-adapter

permissions:
  contents: write

jobs:
  apply-reviewed-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed Stage 2D through Stage 3B changes
        env:
          STAGE3B_PATCH_B64: >-
            
        run: |
          printf '%s' "$STAGE3B_PATCH_B64" | base64 -d | gzip -d > /tmp/stage3b.patch
          git apply --index /tmp/stage3b.patch
          rm -- .github/workflows/stage3b-bootstrap.yml
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'feat: publish Stage 2D through Stage 3B [stage3b-bootstrap]'
          git push
