name: Publish verified Stage 5C branch
on:
  push:
    branches: [feat/stage-5c-mcp-facade]
    paths: [.github/workflows/publish-stage5c.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply reviewed source patch and remove publication files
        run: |
          gzip -dc .github/workflows/stage5c.patch.gz > /tmp/stage5c.patch
          echo "47c638a74736f312ac51a4f251501abaab86190e871268aaf89a27bc44d0abda  /tmp/stage5c.patch" | sha256sum -c -
          git apply --check /tmp/stage5c.patch
          git apply /tmp/stage5c.patch
          git rm .github/workflows/publish-stage5c.yml .github/workflows/stage5c.patch.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile README.md docs pyproject.toml packages/mcp-server
          git commit -m "feat: add provider-neutral local MCP chess facade"
          git push origin HEAD:feat/stage-5c-mcp-facade
